[server]
# Socket path defaults to $XDG_RUNTIME_DIR/sekia/sekiad.sock or ~/.config/sekia/sekiad.sock.
# The daemon creates the parent directory (0700) and verifies ownership before binding.
# socket = "/tmp/sekiad.sock"  # override for Docker or custom setups

[nats]
embedded = true
data_dir = "~/.local/share/sekia/nats"
# Listen on TCP so agents running as separate processes can connect.
# host = "127.0.0.1"
# port = 4222
# Shared token for NATS authentication. Required when NATS listens on TCP
# (host/port set). All agents must use the same token. Env: SEKIA_NATS_TOKEN
# token = ""

[workflows]
dir = "~/.config/sekia/workflows"
hot_reload = true
# Maximum execution time for a single Lua handler invocation.
# Prevents infinite loops from blocking the workflow goroutine.
handler_timeout = "30s"
# Verify every .lua file against the workflows.sha256 manifest before loading.
# Generate the manifest with: sekiactl workflows sign
# verify_integrity = false

[security]
# HMAC-SHA256 secret for signing commands sent to agents. Must match the
# agents' security.command_secret. Env: SEKIA_COMMAND_SECRET
# command_secret = ""

# [secrets]
# aws_region = "us-east-1"                # AWS region for KMS[...] values
# kms_key_id = "alias/sekia"              # default KMS key for sekiactl secrets kms-encrypt
