[nats]
url = "nats://127.0.0.1:4222"
# Shared NATS auth token. Must match the daemon's nats.token. Env: SEKIA_NATS_TOKEN
# token = ""

[github]
# Can also be set via GITHUB_TOKEN env var.
token = ""

[webhook]
listen = ":8080"
path = "/webhook"
# Can also be set via GITHUB_WEBHOOK_SECRET env var.
secret = ""

[poll]
# Enable GitHub REST API polling as an alternative/supplement to webhooks.
# Useful when the agent cannot receive inbound webhooks (e.g., behind a firewall).
enabled = false
# Every tick fetches only the items updated since the previous tick, 100 per page,
# so a steady-state tick is one API call per repo (and per label).
interval = "30s"
# Label and PR-match modes emit every matching item on the first run and again
# every sweep_interval, so an event lost while a component was down is replayed.
# "0" never sweeps: the poller resumes from state_file, or starts one hour back
# on a first run without saved state.
sweep_interval = "1h"
# The poller saves its watermark here after every successful tick and resumes
# from it on restart. "" disables persistence (every restart then sweeps or,
# with sweep_interval = "0", starts one hour back).
# state_file = "~/.local/share/sekia/poll-github-agent.json"
# Repositories to poll (required when enabled). Format: "owner/repo".
# repos = ["myorg/myrepo", "myorg/another-repo"]
# Label-filtered mode: when labels is non-empty, issues carrying ANY of the
# labels are emitted as "github.issue.matched" (PRs and comments are skipped).
# labels = ["Severity:Info"]
# state = "open"  # one of: open, closed, all (default: open)
# PR-match mode: emit "github.pr.matched" for PRs in `state` (optionally
# carrying all of `labels`) instead of time-based events.
# match_prs = false

[log]
# One of: trace, debug, info, warn, error. Env: SEKIA_LOG_LEVEL. Flag: --log-level
level = "info"
